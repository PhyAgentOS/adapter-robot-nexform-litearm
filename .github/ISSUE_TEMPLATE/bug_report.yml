name: Bug report
description: Report a reproducible software, simulation, or documentation issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not disclose security vulnerabilities or private robot data here. Use GitHub private vulnerability reporting instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Unit test / no hardware
        - Fake Dora node
        - MuJoCo simulation
        - Dora workflow
        - Physical robot
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal commands, configuration with secrets removed, and relevant logs.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I stopped physical motion and made the workspace safe before filing this issue.
          required: true
