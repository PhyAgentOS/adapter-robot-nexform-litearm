# Dora 单节点测试：fake 驱动 + 动作源 + 状态消费者
#
# 运行：
#   cd examples/02_dora_tests
#   PATH=$HOME/.dora/bin:$PATH dora run dataflow.yaml
#
# 真机：把 robot 的 args 改成
#   "-u -m litearm_robot.main run --config ../../config/robot.yaml"
# 并先按 examples/01_sdk_tests 完成只读检查。

nodes:
  - id: robot
    path: python
    args: "-u -m litearm_robot.main run --fake --debug"
    inputs:
      tick: dora/timer/millis/20
      action: action_source/action
    outputs:
      - state

  - id: action_source
    path: python
    args: "-u action_source.py --joint joint7 --delta 0.05"
    inputs:
      tick: dora/timer/millis/100
      state: robot/state
    outputs:
      - action

  - id: state_print
    path: python
    args: "-u state_print.py --every 0.5"
    inputs:
      state: robot/state
