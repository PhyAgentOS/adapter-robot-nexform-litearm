# forge-motion-server：LiteArm 7 轴
# URDF 路径相对本文件所在目录。
state_timeout_ms: 200
planning_timeout_ms: 200
execution_timeout_margin_ms: 2000
final_state_timeout_ms: 300
child_cancel_retry_ms: 100
child_cancel_timeout_ms: 1000
result_cache_size: 128

groups:
  litearm_arm:
    joint_names: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
    urdf_path: ../../../assets/urdf/litearm.urdf
    base_frame: base_link
    tip_frame: ee_link
    # 验收阶段保守值；驱动侧 speed=0.1 仍是最终限速。
    max_velocity:
      joint1: 0.5
      joint2: 0.5
      joint3: 0.5
      joint4: 0.5
      joint5: 0.5
      joint6: 0.5
      joint7: 0.5
    max_acceleration:
      joint1: 1.0
      joint2: 1.0
      joint3: 1.0
      joint4: 1.0
      joint5: 1.0
      joint6: 1.0
      joint7: 1.0
    trajectory_sample_period_ms: 20
    max_trajectory_points: 10000
    start_velocity_tolerance: 0.10
    final_joint_tolerance: 0.05
    final_position_tolerance_m: 0.01
    final_orientation_tolerance_rad: 0.05
    ik_max_solution_joint_displacement: 0.5
