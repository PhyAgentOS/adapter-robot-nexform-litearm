# 模板：VR 遥操（验收清单第 13-14 项）
#
# 链路：
#   VR 头显/手柄 -> teleop bridge（IK/映射）-> JointCommand -> 本仓 robot
#
# 参数来源：config/vr.example.yaml
#   （抓取自 lite-vr/litearm-vr-teleop/teleop/config/teleop.yaml，2026-11-05）
# 已知缺口：t_ee 当前为 0（MDH 已由 URDF 反推，见 docs/mdh.md）。
#
# 本文件是结构模板；bridge 节点路径与话题名以现场部署为准。

nodes:
  - id: vr_bridge
    path: python
    args: "-u ${LITE_VR_ROOT}/litearm-vr-teleop/teleop/bridge.py --config ../../../config/vr.yaml"
    inputs:
      tick: dora/timer/millis/20
      robot_state: robot/state
    outputs:
      - action

  - id: robot
    path: python
    args: "-u -m litearm_robot.main run --config ../../../config/robot.yaml"
    inputs:
      tick: dora/timer/millis/20
      action: vr_bridge/action
    outputs:
      - state
