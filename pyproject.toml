[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-litearm"
version = "2.0.0"
description = "Forge/Dora robot adapter for the NexForm LiteArm 7-DOF arm and LiteGrip gripper."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  # Forge 2.x / Dora 1.x dependency baseline.
  "dora-rs>=1.0.1,<2",
  "forge-msgs>=2.1.0,<3",
  "forge-robot>=2.0.0,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Vendor SDKs are not on PyPI. Install them from the internal source trees:
#   pip install -e /path/to/litearm-python
#   pip install -e /path/to/litegrip-python
sdk = ["pyserial>=3.5"]
test = ["pytest>=8"]
build = ["pyinstaller>=6.0"]

[project.scripts]
robot-litearm = "litearm_robot.main:main"
robot-litearm-bridge = "litearm_robot.bridge:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
